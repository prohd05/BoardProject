<html>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="styles.css" rel="stylesheet">
        <title> Board </title>
    </head>
    <body>
        <div>
            <nav class="nav">
                <div class="nLeft">
                    <img class="nLogo" src="assets/logo.png" alt="Logo"/>
                    <h2> Post-It! </h2>
                </div>
                <div class="nRight">
                    <div class="nInfo"> 
                        <img id="pfpBoard" class="navPFP"/>
                        <div class="nNames"> 
                            <p id="unBoard" class="nName" > Name Here... </p>
                            <p id="emBoard" class="nEmail"> Email Here </p>
                        </div>
                    </div>
                </div>
                <div class="nOut">
                    <button id="soBoard" class="paragraph1"> Logout </button>
                </div>
            </nav>

            <form id="research">
                <input type="text" id="researchID" placeholder="Enter Board ID" required/>
                <button id="rsButton" type="submit"> View Board </button>
            </form>
            <button id="backButton"> Back </button>

            <p id="bName"> Board Name: N/A </p>
            <p id="bId"> Board ID: N/A </p>
            <p id="bOwner"> Owner: N/A </p>
            <p id="bMembers"> Members: N/A </p>
            <p id="bMCount"> Member Count: N/A </p>
            <p id="bTF"> Is Member: N/A </p>
            <p id="bDate"> Creation Date: N/A</p>

            <button id="joinButton"> Join Board </button>
            
            <h3> Comments </h3>
            <form id="commentForm">
                
            </form>

            <div id="commentsSection">
            </div>
        </div>
        <script type="module" src="board.js" defer></script>
    </body>
</html>
